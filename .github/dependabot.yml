version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      react:
        patterns: [react, react-dom, react-server-dom-webpack]
      build:
        patterns: [vinext, vite, '@vitejs/*', '@cloudflare/*', wrangler]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
