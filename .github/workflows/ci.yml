name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run eval:verify
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production Worker
        run: npm run start -- --port 3001 > /tmp/plottwist-worker.log 2>&1 &
      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3001/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/plottwist-worker.log
          exit 1
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
